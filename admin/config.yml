backend:
  name: git-gateway
  branch: main

# Where uploaded photos are saved in the repo, and the path used in the site.
media_folder: "images"
public_folder: "images"

# Client edits everything through this one friendly form instead of raw JSON.
collections:
  - name: "site"
    label: "Website Content"
    files:
      - name: "content"
        label: "Homepage Content"
        file: "content/site-content.json"
        fields:
          - { label: "Hero Photo", name: "heroImage", widget: "image" }
          - { label: "Hero Intro Text", name: "heroLede", widget: "text" }

          - { label: "Service 1 Title", name: "service1Title", widget: "string" }
          - { label: "Service 1 Description", name: "service1Desc", widget: "text" }
          - { label: "Service 2 Title", name: "service2Title", widget: "string" }
          - { label: "Service 2 Description", name: "service2Desc", widget: "text" }
          - { label: "Service 3 Title", name: "service3Title", widget: "string" }
          - { label: "Service 3 Description", name: "service3Desc", widget: "text" }
          - { label: "Service 4 Title", name: "service4Title", widget: "string" }
          - { label: "Service 4 Description", name: "service4Desc", widget: "text" }
          - { label: "Service 5 Title", name: "service5Title", widget: "string" }
          - { label: "Service 5 Description", name: "service5Desc", widget: "text" }

          - { label: "Gallery Photo 1", name: "gallery1Image", widget: "image" }
          - { label: "Gallery Photo 2", name: "gallery2Image", widget: "image" }
          - { label: "Gallery Photo 3", name: "gallery3Image", widget: "image" }
          - { label: "Gallery Photo 4", name: "gallery4Image", widget: "image" }
          - { label: "Gallery Photo 5", name: "gallery5Image", widget: "image" }
          - { label: "Gallery Photo 6", name: "gallery6Image", widget: "image" }
          - { label: "Before Photo (renovation in progress)", name: "beforeImage", widget: "image" }
          - { label: "After Photo (finished result)", name: "afterImage", widget: "image" }

          - { label: "About Photo", name: "aboutImage", widget: "image" }
          - { label: "About Title", name: "aboutTitle", widget: "string" }
          - { label: "About Text", name: "aboutText", widget: "text" }

          - { label: "WhatsApp Number (displayed)", name: "whatsappLabel", widget: "string" }
          - { label: "WhatsApp Link", name: "whatsappLink", widget: "string" }
          - { label: "Location Text", name: "locationText", widget: "string" }
